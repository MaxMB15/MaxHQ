// The core's React Native module. uniffi-bindgen-react-native wrote the
// first version, and `ubrn generate` leaves this one be (see noOverwrite in
// ubrn.config.yaml). The app's root project puts the Android and Kotlin
// Gradle plugins on the classpath and sets the SDK and NDK versions every
// module builds with, so this file names none of its own.

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

// The ABIs the Rust core is built for (ANDROID_ABIS in scripts/native.ts),
// narrowed to the ones this build asks for.
def coreAbis() {
  def core = ["arm64-v8a", "x86_64"]
  def asked = rootProject.findProperty("reactNativeArchitectures")
  return asked ? core.findAll { asked.split(",").collect { it.trim() }.contains(it) } : core
}

android {
  namespace "dev.maxhq.core"
  ndkVersion rootProject.ext.ndkVersion
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    // The Rust core looks MaxhqKeys up by name, so R8 keeps it in a
    // release build.
    consumerProguardFiles "proguard-rules.pro"
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
        abiFilters(*coreAbis())
      }
    }
    ndk {
      abiFilters(*coreAbis())
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    prefab true
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  testImplementation "junit:junit:4.13.2"
}

react {
  jsRootDir = file("../src/")
  libraryName = "MaxhqCore"
  codegenJavaPackageName = "dev.maxhq.core"
}
