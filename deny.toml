# cargo deny check licenses fails on any Rust dependency whose license isn't
# below. scripts/check-licenses.mjs holds the same list for npm, so change
# both together. The list holds permissive licenses plus MPL-2.0, all of
# which MaxHQ can ship under its own MIT license.
#
# cargo deny check advisories sources fails on a dependency with a known
# vulnerability, a yanked one, or one from anywhere but crates.io.

[graph]
# Check what the macOS, Linux and Windows builds pull in, whichever machine
# runs the check.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[licenses]
# Every license here lets an MIT-licensed app ship the code. Most ask only
# that the app carry their notice. MPL-2.0 also asks that the source of its
# own files stay available, which crates.io does for an unchanged crate.
# BSL-1.0, which the Windows clipboard crates use, doesn't even ask for the
# notice in a built app. LGPL isn't here, since P-6 allows it only for a
# library the macOS app links dynamically, and no Rust crate links that way.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CC-BY-4.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Python-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
# The list is a policy, not a record of what the tree uses today, so a
# license nothing uses yet isn't an error.
unused-allowed-license = "allow"

# The workspace's own crates carry MaxHQ's MIT license and have publish =
# false, so the check skips them.
[licenses.private]
ignore = true

[advisories]
# A vulnerability always fails. Unmaintained and unsound crates fail only as
# direct dependencies, since paste, proc-macro-error and glib arrive through
# Tauri's GTK stack and only a Tauri update can drop them.
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
