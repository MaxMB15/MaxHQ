[package]
name = "maxhq-hold"
description = "Keeps one agent CLI alive across maxd restarts and records what it prints"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
maxhq-core.workspace = true
maxhq-os.workspace = true
maxhq-protocol.workspace = true
maxhq-term.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["pty", "termios"] }

# Toolhelp finds the thread to resume in a CLI that starts suspended, until
# std's main_thread_handle is stable, and the registry says where Git for
# Windows is.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
] }

# The test binary also plays the holder, the fake agent CLI and the process
# that spawns a holder, so it brings its own main.
[[test]]
name = "holder"
harness = false

[lints]
workspace = true
