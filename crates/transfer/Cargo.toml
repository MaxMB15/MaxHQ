[package]
name = "maxhq-transfer"
description = "Files and folders over a MaxHQ link: manifests, hashes and writes that stay inside their folder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
maxhq-os.workspace = true
maxhq-protocol.workspace = true
maxhq-wire.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[lints]
workspace = true
