[package]
name = "maxhq-os"
description = "The operating system calls MaxHQ makes, behind one API for Unix and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
# On top of the workspace's: a process's command line, junctions, and the
# job rights.
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }

[lints]
workspace = true
