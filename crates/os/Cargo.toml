[package]
name = "maxhq-os"
description = "The operating system calls MaxHQ makes, behind one API for Unix and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# On top of the workspace's: a process's command line and threads,
# junctions, the job rights, the adapters' addresses, the boot count and
# the computer's name.
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
] }

[lints]
workspace = true
