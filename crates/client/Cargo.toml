[package]
name = "maxhq-client"
description = "Connects to maxd over any transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The phone builds with `russh` in place of the defaults. `system-ssh`
# runs the system `ssh`, reads `ssh_config` and sets devices up;
# `tailscale` watches the tailnet; `russh` dials with a key the caller
# gives and a pinned host key; `ws` dials a device's network access over
# TLS pinned to its certificate.
[features]
default = ["system-ssh", "tailscale"]
system-ssh = ["dep:openssh", "dep:sha2"]
tailscale = ["dep:base64", "dep:bytes", "dep:http-body-util", "dep:hyper", "dep:hyper-util"]
russh = ["dep:russh"]
ws = [
    "dep:base64",
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:ring",
    "dep:rustls",
    "dep:subtle",
    "dep:tokio-rustls",
    "dep:tokio-tungstenite",
]

[dependencies]
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
directories.workspace = true
fastrand.workspace = true
futures.workspace = true
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
maxhq-core.workspace = true
maxhq-os.workspace = true
maxhq-protocol.workspace = true
maxhq-transfer.workspace = true
maxhq-wire.workspace = true
openssh = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
rcgen.workspace = true

[[example]]
name = "stop"
required-features = ["system-ssh"]

[[example]]
name = "turn"
required-features = ["system-ssh"]

[[example]]
name = "upload-bench"
required-features = ["system-ssh"]

[[example]]
name = "watch"
required-features = ["system-ssh"]

[lints]
workspace = true
