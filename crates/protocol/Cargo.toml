[package]
name = "maxhq-protocol"
description = "Wire types shared by maxd and every MaxHQ client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
schemars.workspace = true
serde.workspace = true
# `raw_value` lets what a device or guest sends be read item by item.
serde_json = { workspace = true, features = ["raw_value"] }
specta = { workspace = true, features = ["serde_json"] }
# Only for `Number`, which tells the TypeScript exporter a u64 is a plain number.
specta-typescript.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
criterion.workspace = true
# Only for the drift test, which also writes the workflow standard's schemas.
maxhq-workflow.workspace = true

[[bench]]
name = "frame"
harness = false

[lints]
workspace = true
