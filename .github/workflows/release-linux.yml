# The release's Linux app, for x64 and arm64, as an AppImage, a .deb and an
# .rpm, in artifacts named desktop-build-<target>. release.yml calls it, and
# so does the dry run, each after release-linux-maxd.yml: the app carries
# that static maxd, so it runs on every distribution the app does and is the
# maxd the release carries for Linux devices. Nothing here holds a secret or
# a token it could write with: sign-desktop signs the packages for the
# updater.

name: Release Linux

on:
  workflow_call:
    inputs:
      update-manifest:
        description: The manifest the app's updater reads, latest.json or latest-v<n>.json
        type: string
        default: latest.json
      update-pubkey:
        description: The update key the app trusts during a key change; empty keeps tauri.conf.json's
        type: string
        default: ""

permissions: {}

# A called workflow doesn't take its caller's env.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # On the oldest Ubuntu the runners have, since the app needs the glibc it
  # was built with or a newer one.
  build-linux:
    name: build-linux (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            maxd: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            maxd: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      MAXD: ${{ matrix.maxd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      # linuxdeploy, which makes the AppImage, needs file and libfuse2. rpm
      # reads the finished package's dependencies in the check.
      - name: Install the bundle tools
        run: sudo apt-get install -y --no-install-recommends file libfuse2 rpm

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Download maxd
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-maxd-${{ matrix.maxd }}
          path: ${{ runner.temp }}/maxd

      - name: Build the packages
        env:
          # Where the app looks for its updates, written in at build time.
          MAXHQ_RELEASES_REPO: ${{ github.repository }}
          # During an update key change: the manifest the app reads and the
          # key it trusts. Otherwise latest.json and tauri.conf.json's key.
          MAXHQ_UPDATE_MANIFEST: ${{ inputs.update-manifest }}
          MAXHQ_UPDATE_PUBKEY: ${{ inputs.update-pubkey }}
        run: |
          node scripts/release/package-desktop.mjs --target "$TARGET" \
            --maxd "$RUNNER_TEMP/maxd/maxd-$MAXD" --out out

      # The checks CI's desktop-linux job runs on its debug build.
      - name: Check the packages
        run: bash scripts/release/check-linux-packages.sh "target/$TARGET/release/bundle"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-build-${{ matrix.target }}
          path: out/
          retention-days: 7
          if-no-files-found: error

      - name: Disk left
        if: always()
        run: df -h /
