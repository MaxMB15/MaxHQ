# The release's Windows builds, for x64 and arm64: maxd as artifacts named
# windows-maxd-<target>, and the app's NSIS and MSI installers, unsigned, as
# desktop-build-<target>. release.yml calls it, and so does the dry run.
# Nothing here holds a secret or a token it could write with: sign-desktop
# signs the installers for the updater, and Windows code signing is for
# later (.github/RELEASING.md).
#
# The maxd artifacts aren't named release-maxd-*, which sign-macos puts into
# the Mac app, so a Windows build never changes the Mac's.

name: Release Windows

on:
  workflow_call:
    inputs:
      update-manifest:
        description: The manifest the app's updater reads, latest.json or latest-v<n>.json
        type: string
        default: latest.json
      update-pubkey:
        description: The update key the app trusts during a key change; empty keeps tauri.conf.json's
        type: string
        default: ""

permissions: {}

# A called workflow doesn't take its caller's env.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # maxd for each Windows CPU, built natively on each, which the app carries
  # as this computer's service and the release carries for Windows devices.
  windows-maxd:
    name: windows-maxd (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        # The same commands as on Linux, through the runner's Git Bash.
        shell: bash
    steps:
      # .gitattributes keeps LF line endings in this checkout too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        env:
          # Where maxd refreshes its model catalog, written in at build time.
          MAXHQ_CATALOG_URL: https://github.com/${{ github.repository }}/releases/latest/download/model-catalog.json
        run: cargo build --release --locked -p maxd --target "$TARGET"

      - name: Check that it runs
        run: target/$TARGET/release/maxd.exe --version

      # Without .exe, the name maxd-release.json and the app's fleet copy
      # give it (scripts/release/bundles.mjs).
      - name: Stage
        run: |
          set -euo pipefail
          mkdir -p out
          cp "target/$TARGET/release/maxd.exe" "out/maxd-$TARGET"
          sha256sum "out/maxd-$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-maxd-${{ matrix.target }}
          path: out/maxd-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error

  # The app for each Windows CPU with that CPU's maxd, as an NSIS installer
  # and an MSI. Both are unsigned, so SmartScreen warns on the first run.
  build-windows:
    name: build-windows (${{ matrix.target }})
    needs: [windows-maxd]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Download maxd
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-maxd-${{ matrix.target }}
          path: ${{ runner.temp }}/maxd

      - name: Build the installers
        env:
          # Where the app looks for its updates, written in at build time.
          MAXHQ_RELEASES_REPO: ${{ github.repository }}
          # During an update key change: the manifest the app reads and the
          # key it trusts. Otherwise latest.json and tauri.conf.json's key.
          MAXHQ_UPDATE_MANIFEST: ${{ inputs.update-manifest }}
          MAXHQ_UPDATE_PUBKEY: ${{ inputs.update-pubkey }}
        run: |
          node scripts/release/package-desktop.mjs --target "$TARGET" \
            --maxd "$RUNNER_TEMP/maxd/maxd-$TARGET" --out out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-build-${{ matrix.target }}
          path: out/
          retention-days: 7
          if-no-files-found: error
