# Builds a release from a vX.Y.Z tag and uploads it to a draft GitHub release.
# Installed apps see a release only once it's published. .github/RELEASING.md
# explains the whole process.
#
#   prepare-release ─> linux-maxd (x86_64, aarch64) ─┬─> sign-macos (aarch64, x64)
#                   ─> build-macos (aarch64, x64) ───┘
#                   ─> build-ios (iPhone archive)
#                            ─> release-testflight ─> publish-latest-json ─> sync-dev
#
# Building and signing run in separate jobs. The build jobs run every
# dependency's build code, so they get no secret and no token they could
# write with. The jobs that hold a key (sign-macos, release-testflight) run in
# the macos-signing environment, which waits for a reviewer to approve each
# job. They install no dependency and build nothing: they run Apple's tools
# and the release scripts from their own checkout of the tag, which need
# nothing but Node, and they run nothing from the build they sign.
#
# Nothing ships unless every build passes. release-testflight uploads the
# iPhone build only once the Linux, Mac and iPhone builds have all succeeded,
# and publish-latest-json publishes the draft only after that upload.
# "Re-run failed jobs" finishes a release after a failed build or upload.
#
# The tag's message decides whether the draft is published at the end: a line
# that reads exactly `Publish-Release: true` publishes it. The one-click
# pipeline writes that line when its publish box is ticked, and so does
# release-tag.yml. A tag without it stays a draft.
#
# A change of the update key runs over two releases. prepare-release reads
# which step this release is, and .github/RELEASING.md has the owner's steps.

name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

# A tag pushed again while its release is still building waits for that run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The draft exists before any build, so the parallel jobs upload to it
  # without racing to create it.
  prepare-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      key-state: ${{ steps.keys.outputs.key-state }}
      sign-key: ${{ steps.keys.outputs.sign-key }}
      update-manifest: ${{ steps.keys.outputs.update-manifest }}
      next-pubkey: ${{ steps.keys.outputs.next-pubkey }}
      previous: ${{ steps.keys.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Read the version and the publish line
        id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node scripts/release/version.mjs get)
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::The tag is $TAG but Cargo.toml says $VERSION. Tag the commit that bumped the version."
            exit 1
          fi
          # The checkout may hold the tag as a plain ref; the API has its message.
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          TYPE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)
          PUBLISH=false
          if [[ "$TYPE" == tag ]] &&
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq .message | grep -qx 'Publish-Release: true'; then
            PUBLISH=true
          fi
          echo "Version $VERSION. Publish the draft at the end: $PUBLISH."
          { echo "version=$VERSION"; echo "publish=$PUBLISH"; } >> "$GITHUB_OUTPUT"

      # Which step of an update key change this release is:
      # - old: no next key in crates/daemon/src/fleet/next-release-key.pub.
      #   Signed with the current key, and the app reads latest.json, as
      #   before any change.
      # - bridge: the next key is in that file. Signed with the current key,
      #   so every installed app takes it, but the app it ships trusts the
      #   next key and reads latest-v2.json. latest.json stays at this
      #   release from now on.
      # - new: the latest published release has latest-v2.json. Signed with
      #   the next key while that file holds one, and with the current key
      #   once the change is finished and the next key became the current.
      - name: Read the update key change
        id: keys
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The first line that isn't empty or a # comment, as maxd reads it.
          next=$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' crates/daemon/src/fleet/next-release-key.pub |
            grep -v -e '^#' -e '^$' | head -n 1 || true)
          if [[ -n "$next" ]]; then
            current=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").plugins.updater.pubkey')
            node --input-type=module -e '
              import { keyIdText, readPublicKey } from "./scripts/release/sign.mjs";
              let next, current;
              try {
                [next, current] = process.argv.slice(1).map((key) => readPublicKey(key).keyId);
              } catch (error) {
                console.log(`::error::next-release-key.pub: ${error.message}. Put the .pub file there as it is.`);
                process.exit(1);
              }
              if (next.equals(current)) {
                console.log("::error::next-release-key.pub holds the current key. Empty it to finish the key change.");
                process.exit(1);
              }
              console.log(`The next update key is ${keyIdText(next)}.`);' "$next" "$current"
          fi
          previous="" assets=""
          if latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name, .assets[].name' 2> api.err); then
            previous=$(head -n 1 <<< "$latest")
            assets=$(tail -n +2 <<< "$latest")
          elif ! grep -q 'HTTP 404' api.err; then
            cat api.err >&2
            exit 1
          fi
          if [[ "$previous" == "$TAG" ]]; then
            echo "::error::$TAG is already the latest published release, so the release before it can't be read. Release a new version instead."
            exit 1
          fi
          state=old sign=current manifest=latest.json
          if grep -qx 'latest-v2.json' <<< "$assets"; then
            state=new manifest=latest-v2.json
            if [[ -n "$next" ]]; then sign=next; fi
          elif [[ -n "$next" ]]; then
            state=bridge manifest=latest-v2.json
          fi
          echo "Update key: $state. Signed with the $sign key; the app reads $manifest."
          {
            echo "key-state=$state"
            echo "sign-key=$sign"
            echo "update-manifest=$manifest"
            echo "next-pubkey=$next"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          if [[ "$state" != old ]]; then
            {
              echo "### Update key change: $state"
              echo "Signed with the $sign key. The app reads $manifest."
              if [[ "$state" == bridge ]]; then
                echo "latest.json stays at this release from now on. Keep this release."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create the draft release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, so it's reused."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --generate-notes --title "MaxHQ $TAG"
          fi

  # A static maxd for each Linux CPU, built natively on each. The app copies
  # it to Linux devices, and maxd checks it against maxd-release.json. These
  # jobs get no secrets and no token they could write with.
  linux-maxd:
    name: linux-maxd (${{ matrix.target }})
    needs: [prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ring and the bundled SQLite compile C, which needs musl-gcc.
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        env:
          # Where maxd refreshes its model catalog, written in at build time.
          MAXHQ_CATALOG_URL: https://github.com/${{ github.repository }}/releases/latest/download/model-catalog.json
        run: cargo build --release --locked -p maxd --target "$TARGET"

      # A dynamic binary would need the host's loader and libc.
      - name: Check that it's static and runs
        run: |
          bin="target/$TARGET/release/maxd"
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked|statically linked'
          "$bin" --version

      - name: Stage
        run: |
          mkdir -p out
          cp "target/$TARGET/release/maxd" "out/maxd-$TARGET"
          sha256sum "out/maxd-$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-maxd-${{ matrix.target }}
          path: out/maxd-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error

  # One build for each Mac CPU: maxd, maxd-vm and the unsigned app. It gets
  # no secret and no token it could write with, and hands the build to
  # sign-macos as an artifact.
  build-macos:
    name: build-macos (${{ matrix.arch }})
    needs: [prepare-release]
    strategy:
      # Each CPU's build carries on when the other fails.
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          # Tauri and the release assets call the Intel build x64.
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Build maxd, maxd-vm and the app
        env:
          # Where the app looks for its updates, written in at build time.
          MAXHQ_RELEASES_REPO: ${{ github.repository }}
          # During an update key change: the manifest the app reads and the
          # key it trusts. Otherwise latest.json and tauri.conf.json's key.
          MAXHQ_UPDATE_MANIFEST: ${{ needs.prepare-release.outputs.update-manifest }}
          MAXHQ_UPDATE_PUBKEY: ${{ needs.prepare-release.outputs.next-pubkey }}
          # Where maxd refreshes its model catalog, written in at build time.
          MAXHQ_CATALOG_URL: https://github.com/${{ github.repository }}/releases/latest/download/model-catalog.json
        run: sh scripts/release/package-macos.sh build

      # sign-macos runs nothing from the build, so maxd runs here.
      - name: Check that maxd runs
        run: target/release/maxd --version

      # Artifacts keep neither the execute bit nor symlinks, so the build
      # travels as a tar.
      - name: Pack the build
        run: |
          COPYFILE_DISABLE=1 tar -cf macos-build.tar -C target \
            release/bundle/macos/MaxHQ.app release/maxd release/maxd-vm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-build-${{ matrix.arch }}
          path: macos-build.tar
          retention-days: 7
          if-no-files-found: error

  # Signs each Mac build: maxd and maxd-vm, maxd-release.json with the update
  # key, the app, notarizing, the DMG, and the updater archive and its .sig.
  # The Apple secrets and the update key live in the macos-signing
  # environment, so a reviewer approves each job before it starts.
  sign-macos:
    name: sign-macos (${{ matrix.arch }})
    needs: [prepare-release, linux-maxd, build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    environment: macos-signing
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      ARCH: ${{ matrix.arch }}
      KEY_STATE: ${{ needs.prepare-release.outputs.key-state }}
      SIGN_KEY: ${{ needs.prepare-release.outputs.sign-key }}
      NEXT_PUBKEY: ${{ needs.prepare-release.outputs.next-pubkey }}
      OUT: dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node only: no pnpm and no packages.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download the build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-build-${{ matrix.arch }}
          path: ${{ runner.temp }}/download

      # Outside the checkout, so nothing in the build can replace a script
      # this job runs. Only the three paths are taken, and tar refuses names
      # with .. in them and writes through no symlink.
      - name: Unpack the build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build/target"
          tar -xf "$RUNNER_TEMP/download/macos-build.tar" -C "$RUNNER_TEMP/build/target" \
            release/bundle/macos/MaxHQ.app release/maxd release/maxd-vm
          rm -rf "$RUNNER_TEMP/download"

      - name: Download the Linux maxd
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-maxd-*
          merge-multiple: true
          path: ${{ runner.temp }}/linux

      # Fail before signing anything when a key is missing, its password is
      # wrong, or it isn't the private half of the key the app trusts.
      - name: Check the update keys
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_NEXT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_NEXT }}
          TAURI_SIGNING_PRIVATE_KEY_NEXT_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_NEXT_PASSWORD }}
        run: |
          set -euo pipefail
          current=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").plugins.updater.pubkey')
          if [[ "$SIGN_KEY" == current ]]; then
            node scripts/release/sign.mjs --check --expect "$current"
          fi
          if [[ "$KEY_STATE" == bridge || "$SIGN_KEY" == next ]]; then
            node scripts/release/sign.mjs --next --check --expect "$NEXT_PUBKEY"
          fi

      - name: Set up Developer ID signing
        id: apple
        uses: ./.github/actions/macos-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}

      - name: Sign, notarize and package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/build/target
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_NEXT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_NEXT }}
          TAURI_SIGNING_PRIVATE_KEY_NEXT_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_NEXT_PASSWORD }}
          MAXHQ_UPDATE_KEY: ${{ needs.prepare-release.outputs.sign-key }}
          # The bridge release also signs the updater archive with the next key.
          MAXHQ_BRIDGE: ${{ needs.prepare-release.outputs.key-state == 'bridge' && '1' || '' }}
          NOTARIZE: ${{ steps.apple.outputs.notarizing == 'true' && '--notarize' || '' }}
        # NOTARIZE is empty or one flag, so it's left unquoted.
        run: |
          sh scripts/release/package-macos.sh assemble --linux-dir "$RUNNER_TEMP/linux" --require-linux \
            --out "$OUT" $NOTARIZE

      # --no-run: build-macos ran maxd, and this job runs nothing it signs.
      - name: Check the bundle
        env:
          MAXHQ_UPDATE_MANIFEST: ${{ needs.prepare-release.outputs.update-manifest }}
          MAXHQ_UPDATE_PUBKEY: ${{ needs.prepare-release.outputs.next-pubkey }}
        run: |
          sh scripts/release/smoke-test.sh "$RUNNER_TEMP/build/target/release/bundle/macos/MaxHQ.app" \
            --require-linux --require-sig --require-updates --no-run

      - name: Verify signing
        if: steps.apple.outputs.signing == 'true'
        env:
          NOTARIZED: ${{ steps.apple.outputs.notarizing == 'true' && '--notarized' || '' }}
        run: |
          sh scripts/release/verify-signing.sh $NOTARIZED \
            "$RUNNER_TEMP/build/target/release/bundle/macos/MaxHQ.app" "$OUT/MaxHQ_$ARCH.dmg"

      # The catalog every maxd refreshes from, signed with the key that signs
      # this release. One Mac signs it; publish-latest-json uploads it.
      - name: Sign the model catalog
        if: matrix.arch == 'aarch64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_NEXT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_NEXT }}
          TAURI_SIGNING_PRIVATE_KEY_NEXT_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_NEXT_PASSWORD }}
          NEXT: ${{ needs.prepare-release.outputs.sign-key == 'next' && '--next' || '' }}
        # NEXT is empty or one flag, so it's left unquoted.
        run: |
          set -euo pipefail
          mkdir -p catalog
          cp crates/daemon/src/local_models/catalog.json catalog/model-catalog.json
          node scripts/release/sign.mjs $NEXT catalog/model-catalog.json

      - if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-catalog
          path: |
            catalog/model-catalog.json
            catalog/model-catalog.json.sig
          retention-days: 7
          if-no-files-found: error

      # The .next.sig exists only in the bridge release, for latest-v2.json.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-sig-${{ matrix.arch }}
          path: |
            ${{ env.OUT }}/MaxHQ_${{ env.VERSION }}_${{ matrix.arch }}.app.tar.gz.sig
            ${{ env.OUT }}/MaxHQ_${{ env.VERSION }}_${{ matrix.arch }}.app.tar.gz.next.sig
          retention-days: 7
          if-no-files-found: error

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$OUT/MaxHQ_${VERSION}_${ARCH}.app.tar.gz"
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
            "$OUT/MaxHQ_$ARCH.dmg" "$archive" "$archive.sig"

      # The keychain, the certificate and the notarizing key leave the runner
      # even when a step failed.
      - name: Remove the signing keychain and keys
        if: always()
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || echo "::warning::The signing keychain couldn't be deleted."
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/certificate.p12"

  # The iPhone app, archived with no App Store Connect key: Xcode signs it ad
  # hoc, which keeps its entitlements for the export. It needs only the
  # version, so it runs beside the Linux and Mac builds, with no secret and
  # no token it could write with. The archive travels to release-testflight
  # as an artifact kept for a day.
  build-ios:
    needs: [prepare-release]
    # App Store Connect takes only builds made with the iOS 26 SDK, which
    # comes with this image's Xcode.
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      build: ${{ steps.number.outputs.build }}
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      # CocoaPods, which prebuild runs, stops when the locale isn't UTF-8.
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail before the long build, not after it, when a variable is missing.
      - name: Check the app's IDs
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in IOS_TEAM_ID IOS_BUNDLE_ID; do
            if [[ -z "${!name}" ]]; then missing="$missing $name"; fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::The iPhone build needs these, and .github/RELEASING.md says where each goes:$missing"
            exit 1
          fi

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          # The core's two Apple targets, as apps/mobile/scripts/native.ts
          # lists them.
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # The run number only grows and each attempt adds one, so App Store
      # Connect never sees a number twice. native.ts says why local builds
      # stay below these.
      - name: Number the build
        id: number
        run: |
          set -euo pipefail
          build=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/mobile/scripts/mobile.ts build-number)
          echo "MaxHQ $VERSION for the iPhone, build $build."
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # git ignores ios.local.json, so the job writes it.
      - name: Write the app's IDs
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          node -e 'const { IOS_TEAM_ID: teamId, IOS_BUNDLE_ID: bundleId } = process.env;
            process.stdout.write(`${JSON.stringify({ teamId, bundleId }, null, "\t")}\n`);' \
            > apps/mobile/ios.local.json

      # The core in release, prebuild and the archive. It checks that push
      # and the app group are in the archive's signature.
      - name: Build and archive
        env:
          MAXHQ_BUILD_NUMBER: ${{ steps.number.outputs.build }}
          # Where the app looks for mobile.json, and its page in TestFlight,
          # both written into the build.
          MAXHQ_RELEASES_REPO: ${{ github.repository }}
          MAXHQ_APP_STORE_ID: ${{ vars.IOS_APP_STORE_ID }}
        run: pnpm --filter maxhq-mobile mobile:archive

      # Artifacts keep neither the execute bit nor symlinks, so the archive
      # travels as a tar. apps/mobile/scripts/native.ts names its path.
      - name: Pack the archive
        run: COPYFILE_DISABLE=1 tar -cf ios-archive.tar -C apps/mobile/ios/build MaxHQ.xcarchive

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ios-archive
          path: ios-archive.tar
          retention-days: 1
          if-no-files-found: error

  # Exports the iPhone archive as an .ipa signed for App Store Connect and
  # uploads it to TestFlight, once the Linux, Mac and iPhone builds have all
  # succeeded, so a failed build anywhere keeps it out of TestFlight too. Its
  # App Store Connect key isn't the notarizing one: that key has the
  # Developer role, which can't make App Store distribution signing. Xcode
  # makes the distribution certificate in Apple's cloud through this key,
  # which Apple allows only for the Admin role (App Manager fails with "Cloud
  # signing permission error"). The secrets keep their APPLE_APP_MANAGER_
  # names. The key stays in macos-signing, so this job waits for its own
  # approval once the builds are done. While the key is on disk, only the
  # export, which needs nothing but Node and Xcode, and Apple's uploader run.
  release-testflight:
    needs: [linux-maxd, sign-macos, build-ios]
    runs-on: macos-26
    environment: macos-signing
    permissions:
      contents: read
    env:
      BUILD: ${{ needs.build-ios.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node only: no pnpm and no packages.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Only names are printed, never values.
      - name: Check the App Store Connect key and the app's IDs
        env:
          APPLE_APP_MANAGER_KEY_ID: ${{ secrets.APPLE_APP_MANAGER_KEY_ID }}
          APPLE_APP_MANAGER_PRIVATE_KEY: ${{ secrets.APPLE_APP_MANAGER_PRIVATE_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_APP_MANAGER_KEY_ID APPLE_APP_MANAGER_PRIVATE_KEY APPLE_API_ISSUER IOS_TEAM_ID IOS_BUNDLE_ID; do
            if [[ -z "${!name}" ]]; then missing="$missing $name"; fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::The TestFlight upload needs these, and .github/RELEASING.md says where each goes:$missing"
            exit 1
          fi
          if [[ "$APPLE_APP_MANAGER_PRIVATE_KEY" != *"BEGIN PRIVATE KEY"* ]]; then
            echo "::error::APPLE_APP_MANAGER_PRIVATE_KEY isn't the contents of an AuthKey_<id>.p8 file."
            exit 1
          fi

      - name: Download the archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-ios-archive
          path: ${{ runner.temp }}/download

      # Only the archive is taken, and tar refuses names with .. in them and
      # writes through no symlink.
      - name: Unpack the archive
        run: |
          set -euo pipefail
          mkdir -p apps/mobile/ios/build
          tar -xf "$RUNNER_TEMP/download/ios-archive.tar" -C apps/mobile/ios/build MaxHQ.xcarchive
          rm -rf "$RUNNER_TEMP/download"

      # The key goes in the runner's temporary folder, readable only by the
      # runner's user, as AuthKey_<id>.p8, where altool finds it.
      - name: Write the App Store Connect key and the app's IDs
        env:
          APPLE_APP_MANAGER_KEY_ID: ${{ secrets.APPLE_APP_MANAGER_KEY_ID }}
          APPLE_APP_MANAGER_PRIVATE_KEY: ${{ secrets.APPLE_APP_MANAGER_PRIVATE_KEY }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$APPLE_APP_MANAGER_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_$APPLE_APP_MANAGER_KEY_ID.p8"
          node -e 'const { IOS_TEAM_ID: teamId, IOS_BUNDLE_ID: bundleId } = process.env;
            process.stdout.write(`${JSON.stringify({ teamId, bundleId }, null, "\t")}\n`);' \
            > apps/mobile/ios.local.json

      # Signed by Xcode through the API key. It checks that push and the app
      # group survived the export.
      - name: Export the .ipa
        env:
          MAXHQ_ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey_${{ secrets.APPLE_APP_MANAGER_KEY_ID }}.p8
          MAXHQ_ASC_KEY_ID: ${{ secrets.APPLE_APP_MANAGER_KEY_ID }}
          MAXHQ_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/mobile/scripts/mobile.ts export

      # No retry: App Store Connect takes each build number once, so a second
      # try after an upload that got through would only fail.
      - name: Upload to TestFlight
        env:
          APPLE_APP_MANAGER_KEY_ID: ${{ secrets.APPLE_APP_MANAGER_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/asc
        run: |
          set -euo pipefail
          echo "MaxHQ build $BUILD for the iPhone, to TestFlight."
          xcrun altool --upload-app -f apps/mobile/ios/build/export/MaxHQ.ipa -t ios \
            --apiKey "$APPLE_APP_MANAGER_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  # Uploads the Linux maxd, the update manifests, the model catalog and
  # mobile.json once every build has passed and the iPhone build is in
  # TestFlight, then publishes the draft when the tag asked for it.
  publish-latest-json:
    needs: [prepare-release, linux-maxd, sign-macos, build-ios, release-testflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      PUBLISH: ${{ needs.prepare-release.outputs.publish }}
      IOS_BUILD: ${{ needs.build-ios.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download the Linux maxd
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-maxd-*
          merge-multiple: true
          path: linux

      # By name, each from its sign-macos job.
      - name: Download the Apple silicon updater signatures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: updater-sig-aarch64
          path: sigs

      - name: Download the Intel updater signatures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: updater-sig-x64
          path: sigs

      - name: Download the signed model catalog
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: model-catalog
          path: catalog

      - name: Upload the Linux maxd and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd linux
          sha256sum maxd-x86_64-unknown-linux-musl maxd-aarch64-unknown-linux-musl > SHA256SUMS
          cat SHA256SUMS
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
            maxd-x86_64-unknown-linux-musl maxd-aarch64-unknown-linux-musl SHA256SUMS

      # The manifests the app's updater reads, each checked against the key
      # its readers trust. Without a key change, only latest.json, as always.
      # The bridge release writes latest.json for apps on the current key and
      # latest-v2.json for the next. After it, latest-v2.json is the live one
      # and latest.json stays at the bridge release, so an app that skipped
      # the bridge still reaches it first.
      - name: Write and upload the update manifests
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_STATE: ${{ needs.prepare-release.outputs.key-state }}
          SIGN_KEY: ${{ needs.prepare-release.outputs.sign-key }}
          NEXT_PUBKEY: ${{ needs.prepare-release.outputs.next-pubkey }}
          PREVIOUS: ${{ needs.prepare-release.outputs.previous }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          current=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").plugins.updater.pubkey')
          signer=$current
          if [[ "$SIGN_KEY" == next ]]; then signer=$NEXT_PUBKEY; fi
          # manifest <name> <signature suffix> <public key>
          manifest() {
            node scripts/release/latest-json.mjs --version "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --notes-file notes.md --out "$1" --key "$3" \
              --sig "aarch64=sigs/MaxHQ_${VERSION}_aarch64.app.tar.gz$2" \
              --sig "x64=sigs/MaxHQ_${VERSION}_x64.app.tar.gz$2"
            cat "$1"
          }
          case "$KEY_STATE" in
            old)
              manifest latest.json .sig "$signer"
              set -- latest.json
              ;;
            bridge)
              manifest latest.json .sig "$current"
              manifest latest-v2.json .next.sig "$NEXT_PUBKEY"
              set -- latest.json latest-v2.json
              ;;
            new)
              manifest latest-v2.json .sig "$signer"
              mkdir frozen
              if ! gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir frozen; then
                echo "::error::$PREVIOUS has no latest.json to carry forward. .github/RELEASING.md says what to do."
                exit 1
              fi
              if [[ "$(node -p 'require("./frozen/latest.json").version')" == "$VERSION" ]]; then
                echo "::error::latest.json on $PREVIOUS already names $VERSION."
                exit 1
              fi
              cp frozen/latest.json latest.json
              echo "latest.json stays as $PREVIOUS has it."
              set -- latest-v2.json latest.json
              ;;
            *)
              echo "::error::prepare-release gave no update key state."
              exit 1
              ;;
          esac
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber "$@"

      # The catalog every maxd built above refreshes from, and its signature,
      # which maxd checks before it uses a refreshed catalog.
      - name: Upload the model catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
            catalog/model-catalog.json catalog/model-catalog.json.sig

      # After the update manifests, so the line naming the iPhone build stays
      # out of the Mac app's What's new.
      - name: Write and upload mobile.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          node scripts/release/mobile-json.mjs --version "$VERSION" --build "$IOS_BUILD" \
            --repo "$GITHUB_REPOSITORY" --out mobile.json --notes-file notes.md
          cat mobile.json
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber mobile.json
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

      - name: Publish the draft
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "### Published v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: env.PUBLISH != 'true'
        run: |
          {
            echo "### v$VERSION is a draft"
            echo "Check its assets on the releases page, then publish it. Installed apps see it only once it's published."
          } >> "$GITHUB_STEP_SUMMARY"

  # Brings the version bump on main back into dev.
  sync-dev:
    needs: [publish-latest-json]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The PAT, because a push made with GITHUB_TOKEN starts no workflows
          # and can't carry changes to workflow files.
          token: ${{ secrets.RELEASE_AUTOMATION_PAT || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main into dev
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_PAT || github.token }}
        run: |
          set -euo pipefail
          if ! git ls-remote --heads origin dev | grep -q .; then
            echo "::notice::There's no dev branch, so there's nothing to sync."
            exit 0
          fi
          git fetch origin main dev
          git checkout -B dev origin/dev
          if [ "$(git rev-list --count origin/dev..origin/main)" = 0 ]; then
            echo "dev already has everything on main."
            exit 0
          fi
          if git merge --ff-only origin/main 2> /dev/null; then
            echo "Fast-forwarded dev to main."
            git push origin dev
          elif git merge --no-edit -m "chore(release): merge main back into dev" origin/main; then
            echo "Merged main into dev."
            git push origin dev
          else
            echo "::warning::main doesn't merge into dev cleanly, so a pull request is opened instead."
            git merge --abort || true
            branch="chore/sync-main-to-dev-$(date -u +%Y%m%d-%H%M%S)-$GITHUB_RUN_ID"
            git checkout -b "$branch" origin/main
            git push -u origin "$branch"
            gh pr create --base dev --head "$branch" \
              --title "chore(release): merge main back into dev" \
              --body "The release left main with changes dev doesn't have, and they conflict. Resolve the conflicts and merge."
          fi
