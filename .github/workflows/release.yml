# Builds a release from a vX.Y.Z tag and uploads it to a draft GitHub release.
# Installed apps see a release only once it's published. .github/RELEASING.md
# explains the whole process.
#
#   prepare-release ─> linux-maxd (x86_64, aarch64) ─> release-macos (aarch64, x64)
#                   ─> release-ios (iPhone, a signed .ipa)
#                            ─> release-testflight ─> publish-latest-json ─> sync-dev
#
# Nothing ships unless every build passes. The iPhone builds beside the Macs,
# but release-testflight uploads it only once the Linux, Mac and iPhone builds
# have all succeeded, and publish-latest-json publishes the draft only after
# that upload. "Re-run failed jobs" finishes a release after a failed build or
# upload.
#
# The tag's message decides whether the draft is published at the end: a line
# that reads exactly `Publish-Release: true` publishes it. The one-click
# pipeline writes that line when its publish box is ticked, and so does
# release-tag.yml. A tag without it stays a draft.

name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

# A tag pushed again while its release is still building waits for that run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The draft exists before any build, so the parallel jobs upload to it
  # without racing to create it.
  prepare-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Read the version and the publish line
        id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node scripts/release/version.mjs get)
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::The tag is $TAG but Cargo.toml says $VERSION. Tag the commit that bumped the version."
            exit 1
          fi
          # The checkout may hold the tag as a plain ref; the API has its message.
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          TYPE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)
          PUBLISH=false
          if [[ "$TYPE" == tag ]] &&
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq .message | grep -qx 'Publish-Release: true'; then
            PUBLISH=true
          fi
          echo "Version $VERSION. Publish the draft at the end: $PUBLISH."
          { echo "version=$VERSION"; echo "publish=$PUBLISH"; } >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, so it's reused."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --generate-notes --title "MaxHQ $TAG"
          fi

  # A static maxd for each Linux CPU, built natively on each. The app copies
  # it to Linux devices, and maxd checks it against maxd-release.json. These
  # jobs get no secrets and no token they could write with.
  linux-maxd:
    name: linux-maxd (${{ matrix.target }})
    needs: [prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ring and the bundled SQLite compile C, which needs musl-gcc.
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        env:
          # Where maxd refreshes its model catalog, written in at build time.
          MAXHQ_CATALOG_URL: https://github.com/${{ github.repository }}/releases/latest/download/model-catalog.json
        run: cargo build --release --locked -p maxd --target "$TARGET"

      # A dynamic binary would need the host's loader and libc.
      - name: Check that it's static and runs
        run: |
          bin="target/$TARGET/release/maxd"
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked|statically linked'
          "$bin" --version

      - name: Stage
        run: |
          mkdir -p out
          cp "target/$TARGET/release/maxd" "out/maxd-$TARGET"
          sha256sum "out/maxd-$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-maxd-${{ matrix.target }}
          path: out/maxd-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error

  # One build for each Mac CPU. The Apple secrets and the update key live in
  # the macos-signing environment, which waits for a reviewer to approve each
  # job before it starts.
  release-macos:
    name: release-macos (${{ matrix.arch }})
    needs: [prepare-release, linux-maxd]
    strategy:
      # Each CPU's build carries on when the other fails.
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          # Tauri and the release assets call the Intel build x64.
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    environment: macos-signing
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      ARCH: ${{ matrix.arch }}
      OUT: target/release/bundle/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      # Fail before the build, not after it, when the key is missing or
      # malformed.
      - name: Check the update key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/release/sign.mjs --check

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Download the Linux maxd
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-maxd-*
          merge-multiple: true
          path: linux

      # Runs before the Apple secrets are in the environment.
      - name: Build maxd, maxd-vm and the app
        env:
          # Where the app looks for its updates, written in at build time.
          MAXHQ_RELEASES_REPO: ${{ github.repository }}
          # Where maxd refreshes its model catalog, written in at build time.
          MAXHQ_CATALOG_URL: https://github.com/${{ github.repository }}/releases/latest/download/model-catalog.json
        run: sh scripts/release/package-macos.sh build

      - name: Set up Developer ID signing
        id: apple
        uses: ./.github/actions/macos-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}

      - name: Sign, notarize and package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NOTARIZE: ${{ steps.apple.outputs.notarizing == 'true' && '--notarize' || '' }}
        # NOTARIZE is empty or one flag, so it's left unquoted.
        run: sh scripts/release/package-macos.sh assemble --linux-dir linux --require-linux --out "$OUT" $NOTARIZE

      - name: Check the bundle
        run: sh scripts/release/smoke-test.sh target/release/bundle/macos/MaxHQ.app --require-linux --require-sig --require-updates

      - name: Verify signing
        if: steps.apple.outputs.signing == 'true'
        env:
          NOTARIZED: ${{ steps.apple.outputs.notarizing == 'true' && '--notarized' || '' }}
        run: sh scripts/release/verify-signing.sh $NOTARIZED target/release/bundle/macos/MaxHQ.app "$OUT/MaxHQ_$ARCH.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-sig-${{ matrix.arch }}
          path: ${{ env.OUT }}/MaxHQ_${{ env.VERSION }}_${{ matrix.arch }}.app.tar.gz.sig
          retention-days: 7
          if-no-files-found: error

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$OUT/MaxHQ_${VERSION}_${ARCH}.app.tar.gz"
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
            "$OUT/MaxHQ_$ARCH.dmg" "$archive" "$archive.sig"

  # The iPhone app, archived and signed for App Store Connect. It needs only
  # the version, so it runs beside the Linux and Mac builds. It keeps the
  # signed .ipa as an artifact for a day; release-testflight uploads it once
  # every build has passed. Its App Store Connect key isn't the notarizing
  # one: that key has the Developer role, which can't make App Store
  # distribution signing. Xcode makes the distribution certificate in
  # Apple's cloud through this key, which Apple allows only for the Admin
  # role (App Manager fails with "Cloud signing permission error"). The
  # secrets keep their APPLE_APP_MANAGER_ names.
  release-ios:
    needs: [prepare-release]
    # App Store Connect takes only builds made with the iOS 26 SDK, which
    # comes with this image's Xcode.
    runs-on: macos-26
    environment: macos-signing
    permissions:
      contents: read
    outputs:
      build: ${{ steps.number.outputs.build }}
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      # CocoaPods, which prebuild runs, stops when the locale isn't UTF-8.
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail before the long build, not after it, when a secret or variable
      # is missing. Only names are printed, never values.
      - name: Check the App Store Connect key and the app's IDs
        env:
          APPLE_APP_MANAGER_KEY_ID: ${{ secrets.APPLE_APP_MANAGER_KEY_ID }}
          APPLE_APP_MANAGER_PRIVATE_KEY: ${{ secrets.APPLE_APP_MANAGER_PRIVATE_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_APP_MANAGER_KEY_ID APPLE_APP_MANAGER_PRIVATE_KEY APPLE_API_ISSUER IOS_TEAM_ID IOS_BUNDLE_ID; do
            if [[ -z "${!name}" ]]; then missing="$missing $name"; fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::The iPhone build needs these, and .github/RELEASING.md says where each goes:$missing"
            exit 1
          fi
          if [[ "$APPLE_APP_MANAGER_PRIVATE_KEY" != *"BEGIN PRIVATE KEY"* ]]; then
            echo "::error::APPLE_APP_MANAGER_PRIVATE_KEY isn't the contents of an AuthKey_<id>.p8 file."
            exit 1
          fi

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          # The core's two Apple targets, as apps/mobile/scripts/native.ts
          # lists them.
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # The run number only grows and each attempt adds one, so App Store
      # Connect never sees a number twice. native.ts says why local builds
      # stay below these.
      - name: Number the build
        id: number
        run: |
          set -euo pipefail
          build=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/mobile/scripts/mobile.ts build-number)
          echo "MaxHQ $VERSION for the iPhone, build $build."
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # git ignores ios.local.json, so the job writes it. The key goes in the
      # runner's temporary folder, readable only by the runner's user.
      - name: Write the signing settings
        env:
          APPLE_APP_MANAGER_PRIVATE_KEY: ${{ secrets.APPLE_APP_MANAGER_PRIVATE_KEY }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$APPLE_APP_MANAGER_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          node -e 'const { IOS_TEAM_ID: teamId, IOS_BUNDLE_ID: bundleId } = process.env;
            process.stdout.write(`${JSON.stringify({ teamId, bundleId }, null, "\t")}\n`);' \
            > apps/mobile/ios.local.json

      # The core in release, prebuild, archive and export, signed by Xcode
      # through the API key. --ipa keeps the .ipa instead of uploading it. It
      # checks ios.local.json and the variables below before the core builds.
      - name: Build and sign
        env:
          MAXHQ_BUILD_NUMBER: ${{ steps.number.outputs.build }}
          MAXHQ_ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          MAXHQ_ASC_KEY_ID: ${{ secrets.APPLE_APP_MANAGER_KEY_ID }}
          MAXHQ_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          # Where the app looks for mobile.json, and its page in TestFlight,
          # both written into the build.
          MAXHQ_RELEASES_REPO: ${{ github.repository }}
          MAXHQ_APP_STORE_ID: ${{ vars.IOS_APP_STORE_ID }}
        run: pnpm --filter maxhq-mobile mobile:testflight --ipa

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      # Only the signed app travels to the upload job, never the key or the
      # signing settings. apps/mobile/scripts/native.ts names this path.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ios-ipa
          path: apps/mobile/ios/build/export/MaxHQ.ipa
          retention-days: 1
          if-no-files-found: error

  # Uploads the iPhone build to TestFlight once the Linux, Mac and iPhone
  # builds have all succeeded, so a failed build anywhere keeps it out of
  # TestFlight too. The App Store Connect key stays in macos-signing, so this
  # job waits for its own approval once the builds are done. It checks out
  # nothing: while the key is on disk, only Apple's uploader runs.
  release-testflight:
    needs: [linux-maxd, release-macos, release-ios]
    runs-on: macos-26
    environment: macos-signing
    permissions: {}
    env:
      BUILD: ${{ needs.release-ios.outputs.build }}
    steps:
      - name: Download the signed .ipa
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-ios-ipa
          path: ipa

      # altool finds the key as AuthKey_<id>.p8 in API_PRIVATE_KEYS_DIR.
      - name: Write the App Store Connect key
        env:
          APPLE_APP_MANAGER_KEY_ID: ${{ secrets.APPLE_APP_MANAGER_KEY_ID }}
          APPLE_APP_MANAGER_PRIVATE_KEY: ${{ secrets.APPLE_APP_MANAGER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$APPLE_APP_MANAGER_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_$APPLE_APP_MANAGER_KEY_ID.p8"

      # No retry: App Store Connect takes each build number once, so a second
      # try after an upload that got through would only fail.
      - name: Upload to TestFlight
        env:
          APPLE_APP_MANAGER_KEY_ID: ${{ secrets.APPLE_APP_MANAGER_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/asc
        run: |
          set -euo pipefail
          echo "MaxHQ build $BUILD for the iPhone, to TestFlight."
          xcrun altool --upload-app -f ipa/MaxHQ.ipa -t ios \
            --apiKey "$APPLE_APP_MANAGER_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  # Uploads the Linux maxd, latest.json and mobile.json once every build has
  # passed and the iPhone build is in TestFlight, then publishes the draft
  # when the tag asked for it.
  publish-latest-json:
    needs: [prepare-release, linux-maxd, release-macos, release-ios, release-testflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      PUBLISH: ${{ needs.prepare-release.outputs.publish }}
      IOS_BUILD: ${{ needs.release-ios.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download the Linux maxd
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-maxd-*
          merge-multiple: true
          path: linux

      - name: Download the updater signatures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: updater-sig-*
          merge-multiple: true
          path: sigs

      - name: Upload the Linux maxd and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd linux
          sha256sum maxd-x86_64-unknown-linux-musl maxd-aarch64-unknown-linux-musl > SHA256SUMS
          cat SHA256SUMS
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
            maxd-x86_64-unknown-linux-musl maxd-aarch64-unknown-linux-musl SHA256SUMS

      - name: Write and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          node scripts/release/latest-json.mjs --version "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --notes-file notes.md --out latest.json \
            --sig "aarch64=sigs/MaxHQ_${VERSION}_aarch64.app.tar.gz.sig" \
            --sig "x64=sigs/MaxHQ_${VERSION}_x64.app.tar.gz.sig"
          cat latest.json
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber latest.json

      # The catalog every maxd built above refreshes from.
      - name: Upload the model catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp crates/daemon/src/local_models/catalog.json model-catalog.json
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber model-catalog.json

      # After latest.json, so the line naming the iPhone build stays out of
      # the Mac app's What's new.
      - name: Write and upload mobile.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          node scripts/release/mobile-json.mjs --version "$VERSION" --build "$IOS_BUILD" \
            --repo "$GITHUB_REPOSITORY" --out mobile.json --notes-file notes.md
          cat mobile.json
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber mobile.json
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

      - name: Publish the draft
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "### Published v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: env.PUBLISH != 'true'
        run: |
          {
            echo "### v$VERSION is a draft"
            echo "Check its assets on the releases page, then publish it. Installed apps see it only once it's published."
          } >> "$GITHUB_STEP_SUMMARY"

  # Brings the version bump on main back into dev.
  sync-dev:
    needs: [publish-latest-json]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The PAT, because a push made with GITHUB_TOKEN starts no workflows
          # and can't carry changes to workflow files.
          token: ${{ secrets.RELEASE_AUTOMATION_PAT || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main into dev
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_PAT || github.token }}
        run: |
          set -euo pipefail
          if ! git ls-remote --heads origin dev | grep -q .; then
            echo "::notice::There's no dev branch, so there's nothing to sync."
            exit 0
          fi
          git fetch origin main dev
          git checkout -B dev origin/dev
          if [ "$(git rev-list --count origin/dev..origin/main)" = 0 ]; then
            echo "dev already has everything on main."
            exit 0
          fi
          if git merge --ff-only origin/main 2> /dev/null; then
            echo "Fast-forwarded dev to main."
            git push origin dev
          elif git merge --no-edit -m "chore(release): merge main back into dev" origin/main; then
            echo "Merged main into dev."
            git push origin dev
          else
            echo "::warning::main doesn't merge into dev cleanly, so a pull request is opened instead."
            git merge --abort || true
            branch="chore/sync-main-to-dev-$(date -u +%Y%m%d-%H%M%S)-$GITHUB_RUN_ID"
            git checkout -b "$branch" origin/main
            git push -u origin "$branch"
            gh pr create --base dev --head "$branch" \
              --title "chore(release): merge main back into dev" \
              --body "The release left main with changes dev doesn't have, and they conflict. Resolve the conflicts and merge."
          fi
