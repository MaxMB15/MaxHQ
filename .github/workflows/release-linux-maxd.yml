# The release's static Linux maxd, one for each CPU, as artifacts named
# release-maxd-<target>. release.yml calls it, and so does the dry run,
# since the Linux app carries the same maxd. sign-macos puts both into the
# Mac app, so they're the only artifacts named release-maxd-*.

name: Release Linux maxd

on:
  workflow_call:

permissions: {}

# A called workflow doesn't take its caller's env.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A static maxd for each Linux CPU, built natively on each. The app copies
  # it to Linux devices, and maxd checks it against maxd-release.json. These
  # jobs get no secrets and no token they could write with.
  linux-maxd:
    name: linux-maxd (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ring and the bundled SQLite compile C, which needs musl-gcc.
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        env:
          # Where maxd refreshes its model catalog, written in at build time.
          MAXHQ_CATALOG_URL: https://github.com/${{ github.repository }}/releases/latest/download/model-catalog.json
        run: cargo build --release --locked -p maxd --target "$TARGET"

      # A dynamic binary would need the host's loader and libc.
      - name: Check that it's static and runs
        run: |
          bin="target/$TARGET/release/maxd"
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked|statically linked'
          "$bin" --version

      - name: Stage
        run: |
          mkdir -p out
          cp "target/$TARGET/release/maxd" "out/maxd-$TARGET"
          sha256sum "out/maxd-$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-maxd-${{ matrix.target }}
          path: out/maxd-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
